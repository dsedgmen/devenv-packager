name: Promote lsp-css

# After promote-check passes (on main or workflow_dispatch), opens a PR that
# sets tier:yellow ship:true for css.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'containers/lsp-servers/Containerfile'
      - 'containers/lsp-servers/tiers.yaml'
      - 'containers/lsp-servers/promote-check.sh'
      - 'containers/lsp-servers/smoke-lsp.sh'
      - 'containers/lsp-servers/apply-promote.sh'
      - '.github/workflows/_reusable-promote-lsp.yml'
      - '.github/workflows/promote-lsp-css.yml'
  pull_request:
    paths:
      - 'containers/lsp-servers/Containerfile'
      - 'containers/lsp-servers/tiers.yaml'
      - 'containers/lsp-servers/promote-check.sh'
      - 'containers/lsp-servers/smoke-lsp.sh'
      - 'containers/lsp-servers/apply-promote.sh'
      - '.github/workflows/_reusable-promote-lsp.yml'
      - '.github/workflows/promote-lsp-css.yml'

jobs:
  promote:
    uses: ./.github/workflows/_reusable-promote-lsp.yml
    with:
      id: css
    permissions:
      contents: write
      pull-requests: write
