# Reusable: promote-check gate, then open a PR that sets tier:yellow ship:true.
# On push, skips when this id is unaffected (lang-in-diff). Never opens PRs from pull_request.

name: Reusable promote LSP

on:
  workflow_call:
    inputs:
      id:
        description: Language id from tiers.yaml
        required: true
        type: string

jobs:
  gate:
    name: gate ${{ inputs.id }}
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide whether to promote-check
        id: check
        env:
          ID: ${{ inputs.id }}
          EVENT: ${{ github.event_name }}
        run: |
          chmod +x containers/lsp-servers/lang-in-diff.sh
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Promote gate does not run on pull_request"
            exit 0
          fi
          BASE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="origin/main"
          fi
          if containers/lsp-servers/lang-in-diff.sh "$ID" "$BASE" "$HEAD"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping unrelated language $ID"
          fi

  promote-check:
    name: promote-check ${{ inputs.id }}
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Run promote-check
        env:
          CONTAINER_RUNTIME: docker
        run: |
          chmod +x containers/lsp-servers/promote-check.sh
          ./containers/lsp-servers/promote-check.sh "${{ inputs.id }}"

  open-promote-pr:
    name: Open promote PR ${{ inputs.id }}
    needs: promote-check
    # Skipped automatically when promote-check is skipped by gate.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Skip if already promoted
        id: skip
        run: |
          tier=$(python3 containers/lsp-servers/parse-tiers.py containers/lsp-servers/tiers.yaml \
            --query tier --id "${{ inputs.id }}")
          ship=$(python3 containers/lsp-servers/parse-tiers.py containers/lsp-servers/tiers.yaml \
            --query ship --id "${{ inputs.id }}")
          if [ "$tier" = "yellow" ] && [ "$ship" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already yellow/ship — no PR."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply yellow/ship edits
        if: steps.skip.outputs.skip != 'true'
        run: |
          chmod +x containers/lsp-servers/apply-promote.sh
          ./containers/lsp-servers/apply-promote.sh "${{ inputs.id }}"

      - name: Create promote pull request
        if: steps.skip.outputs.skip != 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: promote/${{ inputs.id }}
          delete-branch: true
          title: "Promote lsp-${{ inputs.id }} to yellow"
          commit-message: |
            Promote lsp-${{ inputs.id }} to yellow after promote-check.

            Sets tier: yellow and ship: true, switches build mode to ship,
            and refreshes README status tables for :latest.
          body: |
            ## Summary
            Automated promotion PR for `lsp-${{ inputs.id }}` after `promote-check` passed.

            - `tiers.yaml`: `tier: yellow`, `ship: true`
            - `Containerfile`: `org.devenv.lsp.tier="yellow"` for this target
            - `build-lsp-${{ inputs.id }}.yml`: `mode: ship` (publishes `:latest`)
            - README status tables: category yellow, `lsp-${{ inputs.id }}:latest`, Promote —

            ## Test plan
            - [ ] Confirm `promote-check` was green for `${{ inputs.id }}`
            - [ ] Confirm `build-lsp-${{ inputs.id }}` uses `mode: ship` and publishes `:latest` after merge
            - [ ] Confirm root README LSP CI row shows yellow / `:latest`
          labels: promotion

      - name: Fallback compare link if PR create blocked
        if: always() && steps.skip.outputs.skip != 'true' && steps.cpr.outcome == 'failure'
        env:
          ID: ${{ inputs.id }}
        run: |
          {
            echo "### Promote PR create failed for \`lsp-${ID}\`"
            echo ""
            echo "Branch \`promote/${ID}\` was pushed, but GitHub Actions is not allowed to create PRs."
            echo "Enable: **Settings → Actions → General → Allow GitHub Actions to create and approve pull requests**"
            echo ""
            echo "Or open: https://github.com/${{ github.repository }}/compare/main...promote/${ID}?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
