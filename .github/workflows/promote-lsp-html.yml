name: Promote lsp-html

# Gate only: success means the PR may set tier:yellow ship:true for html.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'containers/lsp-servers/Containerfile'
      - 'containers/lsp-servers/tiers.yaml'
      - 'containers/lsp-servers/promote-check.sh'
      - 'containers/lsp-servers/smoke-lsp.sh'
      - '.github/workflows/_reusable-promote-lsp.yml'
      - '.github/workflows/promote-lsp-html.yml'
  pull_request:
    paths:
      - 'containers/lsp-servers/Containerfile'
      - 'containers/lsp-servers/tiers.yaml'
      - 'containers/lsp-servers/promote-check.sh'
      - 'containers/lsp-servers/smoke-lsp.sh'
      - '.github/workflows/_reusable-promote-lsp.yml'
      - '.github/workflows/promote-lsp-html.yml'

jobs:
  promote:
    uses: ./.github/workflows/_reusable-promote-lsp.yml
    with:
      id: html
