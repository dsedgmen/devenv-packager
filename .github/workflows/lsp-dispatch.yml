# Detect which lsp-<id> images are affected by a shared-path change and build
# only those (fail-fast: false). Avoids starting every thin build/promote workflow.
name: LSP CI

on:
  push:
    branches: [main]
    paths:
      - 'containers/lsp-servers/Containerfile'
      - 'containers/lsp-servers/tiers.yaml'
      - 'containers/lsp-servers/smoke-lsp.sh'
      - 'containers/lsp-servers/build.sh'
      - 'containers/lsp-servers/lang-in-diff.sh'
      - 'flatpak/FEDORA_VERSION'
      - '.github/workflows/_reusable-build-lsp.yml'
      - '.github/workflows/lsp-dispatch.yml'
  pull_request:
    branches: [main]
    paths:
      - 'containers/lsp-servers/Containerfile'
      - 'containers/lsp-servers/tiers.yaml'
      - 'containers/lsp-servers/smoke-lsp.sh'
      - 'containers/lsp-servers/build.sh'
      - 'containers/lsp-servers/lang-in-diff.sh'
      - 'flatpak/FEDORA_VERSION'
      - '.github/workflows/_reusable-build-lsp.yml'
      - '.github/workflows/lsp-dispatch.yml'
  workflow_dispatch:

jobs:
  detect:
    name: Detect changed LSPs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      promote_matrix: ${{ steps.set.outputs.promote_matrix }}
      empty: ${{ steps.set.outputs.empty }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve changed language matrix
        id: set
        run: |
          chmod +x containers/lsp-servers/lang-in-diff.sh
          PARSE=(python3 containers/lsp-servers/parse-tiers.py containers/lsp-servers/tiers.yaml)

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual: build everything shippable + candidates
            BASE=""
            HEAD=""
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            # New branch / zero before
            if [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ -z "$BASE" ]; then
              BASE="origin/main"
            fi
          fi

          ids=()
          promote=()
          while IFS= read -r id; do
            [[ -z "$id" ]] && continue
            tier="$("${PARSE[@]}" --query tier --id "$id")"
            ship="$("${PARSE[@]}" --query ship --id "$id")"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              affected=0
            else
              if containers/lsp-servers/lang-in-diff.sh "$id" "$BASE" "$HEAD"; then
                affected=0
              else
                affected=1
              fi
            fi
            if [ "$affected" -ne 0 ]; then
              continue
            fi
            if [ "$ship" = "true" ] && { [ "$tier" = "green" ] || [ "$tier" = "yellow" ]; }; then
              mode=ship
            elif [ "$tier" = "red" ]; then
              mode=candidate
            else
              continue
            fi
            ids+=("{\"id\":\"$id\",\"mode\":\"$mode\"}")
            if [ "$tier" = "red" ] && [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
              promote+=("{\"id\":\"$id\"}")
            fi
          done < <("${PARSE[@]}" --query ids)

          if [ ${#ids[@]} -eq 0 ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "promote_matrix=[]" >> "$GITHUB_OUTPUT"
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "No languages affected."
          else
            matrix="[$(IFS=,; echo "${ids[*]}")]"
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
            if [ ${#promote[@]} -eq 0 ]; then
              echo "promote_matrix=[]" >> "$GITHUB_OUTPUT"
            else
              echo "promote_matrix=[$(IFS=,; echo "${promote[*]}")]" >> "$GITHUB_OUTPUT"
            fi
            echo "empty=false" >> "$GITHUB_OUTPUT"
            echo "Build matrix: $matrix"
          fi

  build:
    name: lsp-${{ matrix.id }}
    needs: detect
    if: needs.detect.outputs.empty != 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}
    uses: ./.github/workflows/_reusable-build-lsp.yml
    with:
      id: ${{ matrix.id }}
      mode: ${{ matrix.mode }}
    permissions:
      contents: read
      packages: write

  promote:
    name: promote-${{ matrix.id }}
    needs: detect
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect.outputs.empty != 'true' &&
      needs.detect.outputs.promote_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.promote_matrix) }}
    uses: ./.github/workflows/_reusable-promote-lsp.yml
    with:
      id: ${{ matrix.id }}
    permissions:
      contents: write
      pull-requests: write
