name: Build lsp-lua

on:
  push:
    branches: [main]
    paths:
      - 'containers/lsp-servers/Containerfile'
      - 'containers/lsp-servers/tiers.yaml'
      - 'containers/lsp-servers/smoke-lsp.sh'
      - 'containers/lsp-servers/build.sh'
      - 'flatpak/FEDORA_VERSION'
      - '.github/workflows/_reusable-build-lsp.yml'
      - '.github/workflows/build-lsp-lua.yml'
  pull_request:
    branches: [main]
    paths:
      - 'containers/lsp-servers/Containerfile'
      - 'containers/lsp-servers/tiers.yaml'
      - 'containers/lsp-servers/smoke-lsp.sh'
      - 'containers/lsp-servers/build.sh'
      - 'flatpak/FEDORA_VERSION'
      - '.github/workflows/_reusable-build-lsp.yml'
      - '.github/workflows/build-lsp-lua.yml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_reusable-build-lsp.yml
    with:
      id: lua
      mode: candidate
    permissions:
      contents: read
      packages: write
