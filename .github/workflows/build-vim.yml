name: Build vim

on:
  push:
    branches: [main]
    paths:
      - 'containers/vim/**'
      - 'flatpak/FEDORA_VERSION'
      - '.github/workflows/_reusable-build-editor.yml'
      - '.github/workflows/build-vim.yml'
  pull_request:
    branches: [main]
    paths:
      - 'containers/vim/**'
      - 'flatpak/FEDORA_VERSION'
      - '.github/workflows/_reusable-build-editor.yml'
      - '.github/workflows/build-vim.yml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_reusable-build-editor.yml
    with:
      editor: vim
    permissions:
      contents: read
      packages: write
