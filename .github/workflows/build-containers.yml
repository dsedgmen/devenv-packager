name: Build Containers

on:
  push:
    branches: [main]
    paths:
      - 'containers/**'
      - 'scripts/**'
      - 'flatpak/FEDORA_VERSION'
      - '.github/workflows/build-containers.yml'
  pull_request:
    branches: [main]
    paths:
      - 'containers/**'
      - 'scripts/**'
      - 'flatpak/FEDORA_VERSION'
      - '.github/workflows/build-containers.yml'
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  lsp-matrix:
    name: Resolve shippable LSPs
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.set.outputs.languages }}
      fedora: ${{ steps.ver.outputs.fedora }}
    steps:
      - uses: actions/checkout@v5

      - name: Read Fedora version
        id: ver
        run: echo "fedora=$(tr -d '[:space:]' < flatpak/FEDORA_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Shippable language matrix
        id: set
        run: |
          langs=$(python3 containers/lsp-servers/parse-tiers.py containers/lsp-servers/tiers.yaml --query shippable \
            | python3 -c 'import json,sys; print(json.dumps([l for l in sys.stdin.read().splitlines() if l]))')
          echo "languages=$langs" >> "$GITHUB_OUTPUT"
          echo "Shippable: $langs"

  build-lsp:
    name: lsp-${{ matrix.id }}
    needs: lsp-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.lsp-matrix.outputs.languages) }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/lsp-${{ matrix.id }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.devenv.lsp.id=${{ matrix.id }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./containers/lsp-servers
          file: ./containers/lsp-servers/Containerfile
          target: ${{ matrix.id }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lsp-${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=lsp-${{ matrix.id }}
          build-args: |
            FEDORA_VERSION=${{ needs.lsp-matrix.outputs.fedora }}
            USER_UID=1000
            USER_GID=1000

      - name: Resolve image ref for smoke/scan
        id: img
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            first="$(echo "${{ steps.meta.outputs.tags }}" | awk 'NF { print; exit }')"
            docker tag "$first" "lsp-${{ matrix.id }}:latest"
            echo "ref=lsp-${{ matrix.id }}:latest" >> "$GITHUB_OUTPUT"
          else
            ref="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/lsp-${{ matrix.id }}:latest"
            if [ "${{ github.ref }}" != "refs/heads/main" ]; then
              first="$(echo "${{ steps.meta.outputs.tags }}" | awk 'NF { print; exit }')"
              ref="$first"
            fi
            docker pull "$ref" || docker pull "$(echo "${{ steps.meta.outputs.tags }}" | awk 'NF { print; exit }')"
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke LSP
        run: |
          chmod +x containers/lsp-servers/smoke-lsp.sh
          ./containers/lsp-servers/smoke-lsp.sh "${{ steps.img.outputs.ref }}" "${{ matrix.id }}"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}
          # misconfig scans embedded Dockerfiles from RPM contents (e.g. rust-analyzer);
          # Containerfile misconfig is covered by Security fs scan.
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"

  promote-red-status:
    name: Red candidates (not shipped)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: List red languages
        run: |
          echo "Red (not packaged until promote-check.sh passes):"
          python3 containers/lsp-servers/parse-tiers.py containers/lsp-servers/tiers.yaml --query red
          echo ""
          echo "Promotion: pin + Containerfile target + ./containers/lsp-servers/promote-check.sh <id>"

  build-vim:
    name: Build Vim Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Read Fedora version
        id: ver
        run: echo "fedora=$(tr -d '[:space:]' < flatpak/FEDORA_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/vim
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./containers/vim
          file: ./containers/vim/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vim
          cache-to: type=gha,mode=max,scope=vim
          build-args: |
            FEDORA_VERSION=${{ steps.ver.outputs.fedora }}
            USER_UID=1000
            USER_GID=1000
            USERNAME=vimuser

      - name: Smoke COPR packages
        if: github.event_name == 'pull_request'
        run: |
          img="$(echo "${{ steps.meta.outputs.tags }}" | awk 'NF { print; exit }')"
          docker run --rm --entrypoint bash "$img" -lc \
            'command -v vim && command -v devenv-ai-helper && test -f /usr/share/devenv-ai-assistant/vimrc && test -f /etc/vimrc.devenv'

  build-neovim:
    name: Build Neovim Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Read Fedora version
        id: ver
        run: echo "fedora=$(tr -d '[:space:]' < flatpak/FEDORA_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/neovim
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./containers/neovim
          file: ./containers/neovim/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=neovim
          cache-to: type=gha,mode=max,scope=neovim
          build-args: |
            FEDORA_VERSION=${{ steps.ver.outputs.fedora }}
            USER_UID=1000
            USER_GID=1000
            USERNAME=vimuser

      - name: Smoke COPR packages
        if: github.event_name == 'pull_request'
        run: |
          img="$(echo "${{ steps.meta.outputs.tags }}" | awk 'NF { print; exit }')"
          docker run --rm --entrypoint bash "$img" -lc \
            'command -v nvim && command -v devenv-ai-helper && test -f /usr/share/devenv-ai-assistant/nvim-init.lua && test -f /usr/share/devenv-lsp-setup/lsp-config.lua'

  test-editors:
    name: Test editor containers
    needs: [build-vim, build-neovim]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Vim Container
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/vim:latest --version
          docker run --rm --entrypoint bash ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/vim:latest -lc \
            'rpm -q devenv-ai-assistant devenv-ai-helper devenv-lsp-setup'

      - name: Test Neovim Container
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/neovim:latest --version
          docker run --rm --entrypoint bash ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/neovim:latest -lc \
            'rpm -q devenv-ai-assistant devenv-ai-helper devenv-lsp-setup'
