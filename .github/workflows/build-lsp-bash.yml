name: Build lsp-bash

# Per-image status badge. Gate skips when this id is unaffected by the diff.

on:
  push:
    branches: [main]
    paths:
      - 'containers/lsp-servers/Containerfile'
      - 'containers/lsp-servers/tiers.yaml'
      - 'containers/lsp-servers/smoke-lsp.sh'
      - 'containers/lsp-servers/build.sh'
      - 'containers/lsp-servers/lang-in-diff.sh'
      - 'flatpak/FEDORA_VERSION'
      - '.github/workflows/_reusable-build-lsp.yml'
      - '.github/workflows/build-lsp-bash.yml'
  pull_request:
    branches: [main]
    paths:
      - 'containers/lsp-servers/Containerfile'
      - 'containers/lsp-servers/tiers.yaml'
      - 'containers/lsp-servers/smoke-lsp.sh'
      - 'containers/lsp-servers/build.sh'
      - 'containers/lsp-servers/lang-in-diff.sh'
      - 'flatpak/FEDORA_VERSION'
      - '.github/workflows/_reusable-build-lsp.yml'
      - '.github/workflows/build-lsp-bash.yml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_reusable-build-lsp.yml
    with:
      id: bash
      mode: ship
    permissions:
      contents: read
      packages: write
