name: Build lsp-bash

# Manual / release rebuild. Shared-path CI is lsp-dispatch.yml (changed ids only).

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_reusable-build-lsp.yml
    with:
      id: bash
      mode: ship
    permissions:
      contents: read
      packages: write
