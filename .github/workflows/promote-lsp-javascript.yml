name: Promote lsp-javascript

# Status badge + auto promote PR on main when this id changes. Manual: workflow_dispatch.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'containers/lsp-servers/Containerfile'
      - 'containers/lsp-servers/tiers.yaml'
      - 'containers/lsp-servers/promote-check.sh'
      - 'containers/lsp-servers/smoke-lsp.sh'
      - 'containers/lsp-servers/apply-promote.sh'
      - 'containers/lsp-servers/lang-in-diff.sh'
      - '.github/workflows/_reusable-promote-lsp.yml'
      - '.github/workflows/promote-lsp-javascript.yml'

jobs:
  promote:
    uses: ./.github/workflows/_reusable-promote-lsp.yml
    with:
      id: javascript
    permissions:
      contents: write
      pull-requests: write
