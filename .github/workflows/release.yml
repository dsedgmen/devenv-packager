name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true

jobs:
  lsp-matrix:
    name: Resolve shippable LSPs
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.set.outputs.languages }}
      fedora: ${{ steps.ver.outputs.fedora }}
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
    steps:
      - uses: actions/checkout@v5

      - name: Read Fedora version
        id: ver
        run: echo "fedora=$(tr -d '[:space:]' < flatpak/FEDORA_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Extract version
        id: version
        run: |
          VERSION="${{ github.event.release.tag_name || github.event.inputs.version }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major=$(echo "${VERSION}" | cut -d. -f1)" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "${VERSION}" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - name: Shippable language matrix
        id: set
        run: |
          langs=$(python3 containers/lsp-servers/parse-tiers.py containers/lsp-servers/tiers.yaml --query shippable \
            | python3 -c 'import json,sys; print(json.dumps([l for l in sys.stdin.read().splitlines() if l]))')
          echo "languages=$langs" >> "$GITHUB_OUTPUT"

  publish-lsp:
    name: Release lsp-${{ matrix.id }}
    needs: lsp-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.lsp-matrix.outputs.languages) }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./containers/lsp-servers
          file: ./containers/lsp-servers/Containerfile
          target: ${{ matrix.id }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/lsp-${{ matrix.id }}:${{ needs.lsp-matrix.outputs.version }}
            ghcr.io/${{ github.repository }}/lsp-${{ matrix.id }}:${{ needs.lsp-matrix.outputs.major }}
            ghcr.io/${{ github.repository }}/lsp-${{ matrix.id }}:${{ needs.lsp-matrix.outputs.minor }}
            ghcr.io/${{ github.repository }}/lsp-${{ matrix.id }}:latest
          build-args: |
            FEDORA_VERSION=${{ needs.lsp-matrix.outputs.fedora }}
            USER_UID=1000
            USER_GID=1000
          cache-from: type=gha,scope=lsp-${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=lsp-${{ matrix.id }}

  publish-editors:
    name: Release ${{ matrix.image }}
    needs: lsp-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [vim, neovim]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./containers/${{ matrix.image }}
          file: ./containers/${{ matrix.image }}/Containerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ needs.lsp-matrix.outputs.version }}
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ needs.lsp-matrix.outputs.major }}
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ needs.lsp-matrix.outputs.minor }}
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest
          build-args: |
            FEDORA_VERSION=${{ needs.lsp-matrix.outputs.fedora }}
            USER_UID=1000
            USER_GID=1000
            USERNAME=vimuser
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
