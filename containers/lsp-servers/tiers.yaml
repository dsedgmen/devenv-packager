# LSP trust categories (NOT image tags).
#
# green  — Fedora ships an LSP RPM → package as lsp-<id>:latest
# yellow — non-RPM LSP promoted after pin + smoke + Trivy → lsp-<id>:latest
# red    — candidate builds as lsp-<id>:candidate (never :latest until promoted)
#
# Images: ghcr.io/dsedgmen/devenv-packager/lsp-<id>:{latest|candidate,sha,...}
# Label:  org.devenv.lsp.tier=<green|yellow|red>
#
# Promote red → yellow: pass promote-lsp-<id> CI (promote-check); it opens a PR
# that sets tier: yellow and ship: true (or run ./apply-promote.sh <id> locally).

fedora: 45

languages:
  # --- green: Fedora LSP RPM ---
  - id: python
    tier: green
    ship: true
    aliases: [python, pylsp]
    fedora_pkg: python3-lsp-server
    tree_sitter_pkg: libtree-sitter-python
    command: [pylsp]
    binary: pylsp

  - id: go
    tier: green
    ship: true
    aliases: [go, gopls]
    fedora_pkg: gopls
    tree_sitter_pkg: libtree-sitter-go
    command: [gopls]
    binary: gopls

  - id: bash
    tier: green
    ship: true
    aliases: [bash, bashls, sh]
    fedora_pkg: nodejs-bash-language-server
    tree_sitter_pkg: libtree-sitter-bash
    command: [bash-language-server, start]
    binary: bash-language-server

  - id: rust
    tier: green
    ship: true
    aliases: [rust, rust-analyzer]
    fedora_pkg: rust-analyzer
    tree_sitter_pkg: libtree-sitter-rust
    command: [rust-analyzer]
    binary: rust-analyzer

  - id: c-cpp
    tier: green
    ship: true
    aliases: [c, cpp, clangd]
    fedora_pkg: clang-tools-extra
    tree_sitter_pkg: libtree-sitter-c
    command: [clangd]
    binary: clangd

  # --- red candidates (pin + Containerfile target; ship after promote-check) ---
  - id: javascript
    tier: red
    ship: false
    aliases: [javascript, js]
    tree_sitter_pkg: libtree-sitter-javascript
    planned_source: npm:typescript-language-server
    pin: npm:typescript-language-server@6.1.0+typescript@5.9.3
    command: [typescript-language-server, --stdio]
    binary: typescript-language-server

  - id: typescript
    tier: red
    ship: false
    aliases: [typescript, ts]
    tree_sitter_pkg: libtree-sitter-typescript
    planned_source: npm:typescript-language-server
    pin: npm:typescript-language-server@6.1.0+typescript@5.9.3
    command: [typescript-language-server, --stdio]
    binary: typescript-language-server

  - id: json
    tier: yellow
    ship: true
    aliases: [json]
    tree_sitter_pkg: libtree-sitter-json
    planned_source: npm:vscode-langservers-extracted
    pin: npm:vscode-langservers-extracted@4.10.0
    command: [vscode-json-language-server, --stdio]
    binary: vscode-json-language-server

  - id: yaml
    tier: yellow
    ship: true
    aliases: [yaml]
    tree_sitter_pkg: libtree-sitter-yaml
    planned_source: npm:yaml-language-server
    pin: npm:yaml-language-server@2.0.0
    command: [yaml-language-server, --stdio]
    binary: yaml-language-server

  - id: html
    tier: red
    ship: false
    aliases: [html]
    tree_sitter_pkg: libtree-sitter-html
    planned_source: npm:vscode-langservers-extracted
    pin: npm:vscode-langservers-extracted@4.10.0
    command: [vscode-html-language-server, --stdio]
    binary: vscode-html-language-server

  - id: css
    tier: red
    ship: false
    aliases: [css]
    tree_sitter_pkg: libtree-sitter-css
    planned_source: npm:vscode-langservers-extracted
    pin: npm:vscode-langservers-extracted@4.10.0
    command: [vscode-css-language-server, --stdio]
    binary: vscode-css-language-server

  - id: lua
    tier: red
    ship: false
    aliases: [lua]
    tree_sitter_pkg: libtree-sitter-lua
    planned_source: github:LuaLS/lua-language-server
    pin: github:LuaLS/lua-language-server@3.19.2#sha256:93ad326b10f6c00911dd8c450fa098332dbd8f9f45d1052f5636a2d54479b947
    command: [lua-language-server]
    binary: lua-language-server

  - id: java
    tier: red
    ship: false
    aliases: [java]
    tree_sitter_pkg: libtree-sitter-java
    planned_source: eclipse-jdtls
    pin: eclipse-jdtls@1.64.0#sha256:7a6351a39ab105396ca3a8e3e5b40101f95d9b56aa7c7b8225065fa9448b077b
    command: [jdtls]
    binary: jdtls

  - id: ruby
    tier: red
    ship: false
    aliases: [ruby]
    tree_sitter_pkg: libtree-sitter-ruby
    planned_source: gem:ruby-lsp
    pin: gem:ruby-lsp@0.26.11
    command: [ruby-lsp]
    binary: ruby-lsp
