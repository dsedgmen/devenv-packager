app-id: org.devenv.Neovim
runtime: org.fedoraproject.Platform
runtime-version: f45
sdk: org.fedoraproject.Sdk
command: nvim

finish-args:
  # Filesystem access
  - --filesystem=host
  - --filesystem=xdg-config/git:ro

  # Network for AI backends
  - --share=network

  # IPC for clipboard
  - --share=ipc
  - --socket=x11
  - --socket=wayland

  # Device access
  - --device=dri

modules:
  # Fedora f45 neovim Source0 + Source3 treesitter vendor, plus cmake.deps pins
  # (libuv/luajit/…) as type:file so flatpak-builder fetches them on the host
  # and the build sandbox stays offline (Fedora Sdk lacks these -devel pkgs).
  - name: neovim
    buildsystem: simple
    build-commands:
      - mkdir -p .deps/build
      - ln -sfr neovim-0.12.6-vendor .deps/build/downloads
      - cmake -S cmake.deps -B .deps -G Ninja -DCMAKE_BUILD_TYPE=Release
      - cmake --build .deps
      - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/app
      - cmake --build build
      - cmake --install build
    sources:
      - type: archive
        url: https://src.fedoraproject.org/repo/pkgs/neovim/neovim-0.12.6.tar.gz/sha512/7baf1a6c5e46845b415f522ad17129a3af33c698356f1f7f276481a7f55e3fc994ba1399aac85e1cd1b8436cc59f733ff1fddc12cdb027c295be1abd2dd20448/neovim-0.12.6.tar.gz
        sha256: 8629fdc5eb951daf89a76f68cad12f2f1e03fab0d539150ba3fe6d177d254b7f
      - type: archive
        url: https://src.fedoraproject.org/repo/pkgs/neovim/neovim-0.12.6-vendor.tar.gz/sha512/65ea5c83822af486312945ff41f57363739e479d9abd14de57ab05e226b73f29728215985dece7cee6f07b79f8cb16cce8745409909b533fa1244e45e5880ec5/neovim-0.12.6-vendor.tar.gz
        sha256: 233fd89d1bdf1ef312259029896a645ef302f13010202ce727cdf240123b28c0
        dest: neovim-0.12.6-vendor
      # cmake.deps/deps.txt pins (SHA256 must match; fetched outside the build bubble)
      - type: file
        url: https://github.com/libuv/libuv/archive/v1.52.1.tar.gz
        sha256: 478baf2599bfbc882c355288c9cb6f92e0e7dda435fa04031fa5b607cf3f414c
        dest: neovim-0.12.6-vendor/libuv
        dest-filename: v1.52.1.tar.gz
      - type: file
        url: https://github.com/luajit/luajit/archive/fbb36bb6bfa88716a47c58bcf9ce9f2ef752abac.tar.gz
        sha256: e60cd2f3057aa39d33d1c895a20087ab54494d9a1ca45aa488ff0378af42df48
        dest: neovim-0.12.6-vendor/luajit
        dest-filename: fbb36bb6bfa88716a47c58bcf9ce9f2ef752abac.tar.gz
      - type: file
        url: https://github.com/neovim/unibilium/archive/v2.1.2.tar.gz
        sha256: 370ecb07fbbc20d91d1b350c55f1c806b06bf86797e164081ccc977fc9b3af7a
        dest: neovim-0.12.6-vendor/unibilium
        dest-filename: v2.1.2.tar.gz
      - type: file
        url: https://github.com/luvit/luv/archive/1.52.1-0.tar.gz
        sha256: e8b8774b31d24be4fcf2b021b90599ecccc8e476c61efcc59c3c10cab813a885
        dest: neovim-0.12.6-vendor/luv
        dest-filename: 1.52.1-0.tar.gz
      - type: file
        url: https://github.com/lunarmodules/lua-compat-5.3/archive/v0.13.tar.gz
        sha256: f5dc30e7b1fda856ee4d392be457642c1f0c259264a9b9bfbcb680302ce88fc2
        dest: neovim-0.12.6-vendor/lua_compat53
        dest-filename: v0.13.tar.gz
      - type: file
        url: https://github.com/neovim/deps/raw/d495ee6f79e7962a53ad79670cb92488abe0b9b4/opt/lpeg-1.1.0.tar.gz
        sha256: 4b155d67d2246c1ffa7ad7bc466c1ea899bbc40fef0257cc9c03cecbaed4352a
        dest: neovim-0.12.6-vendor/lpeg
        dest-filename: lpeg-1.1.0.tar.gz
      - type: file
        url: https://github.com/juliastrings/utf8proc/archive/v2.11.3.tar.gz
        sha256: abfed50b6d4da51345713661370290f4f4747263ee73dc90356299dfc7990c78
        dest: neovim-0.12.6-vendor/utf8proc
        dest-filename: v2.11.3.tar.gz

  # Fedora f45 python-lsp-server Source0
  - name: python-lsp-server
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-build-isolation .
    sources:
      - type: archive
        url: https://src.fedoraproject.org/repo/pkgs/python-lsp-server/python-lsp-server-1.14.0.tar.gz/sha512/72d6a86887355111a63569a11443f6c3dd910c61ff9084284cb428f6963d0dc03594a05049aca4306f5af609dac7a7db351bb6ff1b499ffbbdf74bec83cce9fa/python-lsp-server-1.14.0.tar.gz
        sha256: 6cd33b9dc7b09fb58919a02c7f3636f5933103946c2fd12a1f24c5101ff21650

  # Fedora f45 vim-fugitive Source0
  - name: vim-fugitive
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/nvim/site/pack/plugins/start/fugitive
      - cp -a * /app/share/nvim/site/pack/plugins/start/fugitive/
    sources:
      - type: archive
        url: https://src.fedoraproject.org/repo/pkgs/vim-fugitive/vim-fugitive-3.7.tar.gz/sha512/8252b69c6183f5b710739eb68ecb3fbdfad52df3dbee0a3a04ad33f410b489d7fcf1c0bde0cb2d53995a6b4e34191c165c652d08e6145789a88f8c46bfcddf56/vim-fugitive-3.7.tar.gz
        sha256: 1deeb9fffe3e3299375842657cb2d6b7059a67d3373dc0ab52c16d7a7c99ea2a

  # Fedora f45 vim-gitgutter Source0
  - name: vim-gitgutter
