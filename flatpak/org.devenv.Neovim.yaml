app-id: org.devenv.Neovim
runtime: org.fedoraproject.Platform
runtime-version: f45
sdk: org.fedoraproject.Sdk
command: nvim

finish-args:
  # Filesystem access
  - --filesystem=host
  - --filesystem=xdg-config/git:ro

  # Network for AI backends
  - --share=network

  # IPC for clipboard
  - --share=ipc
  - --socket=x11
  - --socket=wayland

  # Device access
  - --device=dri

build-options:
  prepend-path: /app/bin
  prepend-pkg-config-path: /app/lib/pkgconfig
  append-ld-library-path: /app/lib
  env:
    CMAKE_PREFIX_PATH: /app
    PKG_CONFIG_PATH: /app/lib/pkgconfig

modules:
  # --- Neovim deps from Fedora f45 lookaside (same blobs as Fedora packages) ---
  - name: libuv
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
      - -DLIBUV_BUILD_SHARED=ON
    cleanup:
      - /share/man
      - /share/doc
    sources:
      - type: archive
        url: https://src.fedoraproject.org/repo/pkgs/libuv/libuv-v1.52.1.tar.gz/sha512/3dbb61067c03d025fd880afa2015e67d9cd9de2672df2bfb9901a48759f7bd1285a600b4ac4177c1ee0bf8418c7b967fef356f81e37765e33a818df0aabdc1aa/libuv-v1.52.1.tar.gz
        sha256: 66d511b9e6e334c0e62279eb234fbfb2b3110b1479c09b95b44c7afca8cff9e7

  - name: unibilium
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TOOLS=OFF
      - -DBUILD_TESTS=OFF
    cleanup:
      - /share/man
    sources:
      - type: archive
        url: https://src.fedoraproject.org/repo/pkgs/unibilium/unibilium-2.1.4.tar.gz/sha512/e1d351b7f4c13825c415f3b8078abd538863614a8aa443e3c5e5b85110372084ff4385c4b17eb7a546807188265285ca4b6493b6db9670d490f7743b89f11c4f/unibilium-2.1.4.tar.gz
        sha256: 7360907bcf79ba49f6fc4a504767ff86e93ab9018477026fcc70d5ab77e1f2c1

  - name: utf8proc
    buildsystem: simple
    build-commands:
      - make -j"${FLATPAK_BUILDER_N_JOBS}" prefix=/app
      - make install prefix=/app
    cleanup:
      - /share
    sources:
      - type: archive
        url: https://src.fedoraproject.org/repo/pkgs/utf8proc/utf8proc-v2.11.3.tar.gz/sha512/148701fce506d076f03497b6d085f1993eff743debad4a2f6d3cbac91e19a5c22d9938245bdb460c1b22b51842c7416c42124db7416c684ee63d622490baac0e/utf8proc-v2.11.3.tar.gz
        sha256: abfed50b6d4da51345713661370290f4f4747263ee73dc90356299dfc7990c78

  - name: luajit
    no-autogen: true
    make-args:
      - PREFIX=/app
      - BUILDMODE=dynamic
    make-install-args:
      - PREFIX=/app
    cleanup:
      - /share/man
      - /share/luajit-2.1/jit
    sources:
      - type: archive
        url: https://src.fedoraproject.org/repo/pkgs/luajit/LuaJIT-2.1.1767980792.tar.gz/sha512/c14c8c98c1e484cdad8d8408f3863d54addb8af7800ff548608559381d8247eac885bfef00c47274e93f9c17235aa93c3b33f3b4acc4bb1404c1ad848f3ccab6/LuaJIT-2.1.1767980792.tar.gz
        sha256: 00361a660e4496dc125818ea6881d17e1c45a341e5400edfd531f2ba5ce863d7

  - name: luv
    # Fedora lookaside Source0 for luv + lua-compat53 (luv tarball has empty submodule dirs)
    buildsystem: simple
    build-commands:
      - >
        cmake -S . -B build -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_INSTALL_PREFIX=/app
        -DBUILD_MODULE=OFF
        -DBUILD_SHARED_LIBS=ON
        -DWITH_SHARED_LIBUV=ON
        -DWITH_LUA_ENGINE=LuaJIT
        -DLUA_BUILD_TYPE=System
        -DLUA_COMPAT53_DIR=$PWD/deps/lua-compat-5.3
      - cmake --build build
      - cmake --install build
    cleanup:
      - /share
    sources:
      - type: archive
        url: https://src.fedoraproject.org/repo/pkgs/lua-luv/luv-1.53.0.0.tar.gz/sha512/528f8bd306805a804b61766ce25eeba4332859a132a1905ff6122e2750f8f8588c302649dd7d1dbfff09b40778b3b9f19cb19b67d861016be034cbcf36cddf8d/luv-1.53.0.0.tar.gz
        sha256: bd393b5918f320c79a2c6405e3abebe01c024557c32b9fb9006bee20ce71e19e
      - type: shell
        commands:
          - rm -rf deps/lua-compat-5.3
      - type: archive
        url: https://src.fedoraproject.org/repo/pkgs/lua-compat53/lua-compat53-0.7.tar.gz/sha512/665ece98422a105b818cffd96eea5788696fbb854d2ba41d2d387e8bd25c1fa9de601468e55e22e9e749979a66d4d2e0f7dfd656e5bf27b489d37bb07c96f48d/lua-compat53-0.7.tar.gz
        sha256: bec3a23114a3d9b3218038309657f0f506ad10dfbc03bb54e91da7e5ffdba0a2
        dest: deps/lua-compat-5.3

  - name: lpeg
    buildsystem: simple
    build-commands:
      - make -j"${FLATPAK_BUILDER_N_JOBS}" LUADIR=/app/include/luajit-2.1
      - install -Dm755 lpeg.so /app/lib/lua/5.1/lpeg.so
      - install -Dm644 re.lua /app/share/lua/5.1/re.lua
    sources:
      - type: archive
        url: https://src.fedoraproject.org/repo/pkgs/lua-lpeg/lpeg-1.1.0.tar.gz/sha512/01b2a4ceb2d110e143603bc63c84a59736ea735dd0ed9866286ba115d41be48d09c9ff21c8e2327974d2296944f6508d50a5c3a18f26ac1d81b8b2fc41f61222/lpeg-1.1.0.tar.gz
        sha256: 4b155d67d2246c1ffa7ad7bc466c1ea899bbc40fef0257cc9c03cecbaed4352a

  - name: tree-sitter
    buildsystem: simple
    build-commands:
      - make -j"${FLATPAK_BUILDER_N_JOBS}" PREFIX=/app
      - make install PREFIX=/app LIBDIR=/app/lib INCLUDEDIR=/app/include
    cleanup:
      - /share
    sources:
      - type: archive
        url: https://src.fedoraproject.org/repo/pkgs/tree-sitter/tree-sitter-0.26.13.tar.gz/sha512/3278ae1f65bc2cf4861f9fec1082089c155a59cc6fb96940cc56630518338327f9069ca144157e4e4d810fd437c45d46db8ce4974c66ffc63672b105b1e6aa72/tree-sitter-0.26.13.tar.gz
        sha256: ece24c3c5e2a76384075e830c7139b59fce8fb01e4ef8436fab08bbe10444c89

  # Fedora f45 neovim Source0 + Source3 treesitter-parser vendor (offline parsers)
  - name: neovim
    buildsystem: simple
    build-commands:
      - mkdir -p .deps/build
      - ln -sfr neovim-0.12.6-vendor .deps/build/downloads
      - >
        cmake -S cmake.deps -B .deps -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DUSE_BUNDLED=OFF
        -DUSE_BUNDLED_TS_PARSERS=ON
      - cmake --build .deps
      - >
        cmake -S . -B build -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_INSTALL_PREFIX=/app
        -DCMAKE_PREFIX_PATH=/app
        -DUSE_BUNDLED=OFF
        -DPREFER_LUA=OFF
        -DLUA_PRG=/app/bin/luajit
        -DENABLE_JEMALLOC=OFF
        -DLIBLUV_INCLUDE_DIR=/app/include
      - cmake --build build
      - cmake --install build
      # Extension mount points must exist in the parent app for Flatpak to bind-mount addons
      - mkdir -p /app/lsp/python /app/lsp/go /app/lsp/bash /app/lsp/rust
      - mkdir -p /app/tree-sitter/Python
    sources:
      - type: archive
        url: https://src.fedoraproject.org/repo/pkgs/neovim/neovim-0.12.6.tar.gz/sha512/7baf1a6c5e46845b415f522ad17129a3af33c698356f1f7f276481a7f55e3fc994ba1399aac85e1cd1b8436cc59f733ff1fddc12cdb027c295be1abd2dd20448/neovim-0.12.6.tar.gz
        sha256: 8629fdc5eb951daf89a76f68cad12f2f1e03fab0d539150ba3fe6d177d254b7f
      - type: archive
        url: https://src.fedoraproject.org/repo/pkgs/neovim/neovim-0.12.6-vendor.tar.gz/sha512/65ea5c83822af486312945ff41f57363739e479d9abd14de57ab05e226b73f29728215985dece7cee6f07b79f8cb16cce8745409909b533fa1244e45e5880ec5/neovim-0.12.6-vendor.tar.gz
        sha256: 233fd89d1bdf1ef312259029896a645ef302f13010202ce727cdf240123b28c0
        dest: neovim-0.12.6-vendor

  # Fedora f45 python-lsp-server Source0
  - name: python-lsp-server
    buildsystem: simple
    build-commands:
      - PYTHONUSERBASE=/app pip3 install --user --no-deps --no-build-isolation .
    sources:
      - type: archive
        url: https://src.fedoraproject.org/repo/pkgs/python-lsp-server/python-lsp-server-1.14.0.tar.gz/sha512/72d6a86887355111a63569a11443f6c3dd910c61ff9084284cb428f6963d0dc03594a05049aca4306f5af609dac7a7db351bb6ff1b499ffbbdf74bec83cce9fa/python-lsp-server-1.14.0.tar.gz
        sha256: 6cd33b9dc7b09fb58919a02c7f3636f5933103946c2fd12a1f24c5101ff21650

  # Fedora f45 vim-fugitive Source0
  - name: vim-fugitive
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/nvim/site/pack/plugins/start/fugitive
      - cp -a * /app/share/nvim/site/pack/plugins/start/fugitive/
    sources:
      - type: archive
        url: https://src.fedoraproject.org/repo/pkgs/vim-fugitive/vim-fugitive-3.7.tar.gz/sha512/8252b69c6183f5b710739eb68ecb3fbdfad52df3dbee0a3a04ad33f410b489d7fcf1c0bde0cb2d53995a6b4e34191c165c652d08e6145789a88f8c46bfcddf56/vim-fugitive-3.7.tar.gz
        sha256: 1deeb9fffe3e3299375842657cb2d6b7059a67d3373dc0ab52c16d7a7c99ea2a

  # Fedora f45 vim-gitgutter Source0
  - name: vim-gitgutter
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/nvim/site/pack/plugins/start/gitgutter
      - cp -a * /app/share/nvim/site/pack/plugins/start/gitgutter/
    sources:
      - type: archive
        url: https://src.fedoraproject.org/repo/pkgs/vim-gitgutter/vim-gitgutter-0.20230901gitf7b9766.tar.gz/sha512/156399d3d9c781d63362eece5bdbf6a847ae4e2c41c3e2208ffed290c4bfaa2e0feb3f71d82a631f5629af919227b510d5e4d87baca039062cd0e4ed9cbafe6c/vim-gitgutter-0.20230901gitf7b9766.tar.gz
        sha256: b81ac74b62c218beabab3bcc73ee47ba0cf1b8a9d9e658ce9a3957b18c5fb22c

  # Fedora f45 vim-nerdtree Source0
  - name: vim-nerdtree
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/nvim/site/pack/plugins/start/nerdtree
      - cp -a * /app/share/nvim/site/pack/plugins/start/nerdtree/
    sources:
      - type: archive
        url: https://src.fedoraproject.org/repo/pkgs/vim-nerdtree/vim-nerdtree-7.1.3.tar.gz/sha512/f700facf00a837ba44a1844bc68633d88333e2d1a2debc83ec1fee4897dfc30bbc1abe3f4cc89c6b533a7db74e29470f344a6180de3d8e7fe638457d89b5ef5b/vim-nerdtree-7.1.3.tar.gz
        sha256: 1fd6a7e9ca3427c82dcf15657fff6c3e090e5d9605a7c3b382fc22c0bb3834e9

  # Fedora f45 vim-ctrlp Source0
  - name: vim-ctrlp
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/nvim/site/pack/plugins/start/ctrlp
      - cp -a * /app/share/nvim/site/pack/plugins/start/ctrlp/
    sources:
      - type: archive
        url: https://src.fedoraproject.org/repo/pkgs/vim-ctrlp/vim-ctrlp-2e773fd.tar.gz/sha512/ec79125fc53a6dabfa2ce1fc1006b3b992ccd9db3c2eb489e197d00509d3853673441583cb08c57269feb81621bf7a7d1f9185d7c95bfe137460a7248ee8ab70/vim-ctrlp-2e773fd.tar.gz
        sha256: bd16f1a3e5eafd45c94218ffe8357ba0e731989170a02fd53376ac8f9b8be35e

  # Fedora f45 vim-commentary Source0 (lookaside still keyed by md5 in dist-git)
  - name: vim-commentary
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/nvim/site/pack/plugins/start/commentary
      - cp -a * /app/share/nvim/site/pack/plugins/start/commentary/
    sources:
      - type: archive
        url: https://src.fedoraproject.org/repo/pkgs/vim-commentary/vim-commentary-1.3.tar.gz/md5/814846695d5254a46118d574f33d9dbb/vim-commentary-1.3.tar.gz
        sha256: 6c790529af9db49d9156ff06301f3a1ee553f751adf044d64054cba95dee8194

  # AI helper and configs (from scripts/prepare-build-context.sh → ../build-context)
  - name: devenv-ai-assistant
    buildsystem: simple
    build-commands:
      - install -Dm755 devenv-ai-helper /app/bin/devenv-ai-helper
      - ln -s devenv-ai-helper /app/bin/vim-ai-helper
      - install -Dm644 init.lua /app/share/nvim/init.lua
      - install -Dm644 lsp-config.lua /app/share/nvim/lua/lsp-config.lua
      - install -Dm644 treesitter-config.lua /app/share/nvim/lua/treesitter-config.lua
      - install -Dm644 plugins-config.lua /app/share/nvim/lua/plugins-config.lua
    sources:
      - type: file
        path: ../build-context/devenv-ai-helper
      - type: file
        path: ../build-context/nvim/init.lua
      - type: file
        path: ../build-context/nvim/lua/lsp-config.lua
      - type: file
        path: ../build-context/nvim/lua/treesitter-config.lua
      - type: file
        path: ../build-context/nvim/lua/plugins-config.lua

# Extensions for LSP servers and tree-sitter parsers
add-extensions:
  # LSP servers as addons
  org.devenv.Neovim.LSP.Python:
    directory: lsp/python
    version: stable
    no-autodownload: false
    autodelete: false

  org.devenv.Neovim.LSP.Go:
    directory: lsp/go
    version: stable
    no-autodownload: false
    autodelete: false

  org.devenv.Neovim.LSP.Bash:
    directory: lsp/bash
    version: stable
    no-autodownload: false
    autodelete: false

  org.devenv.Neovim.LSP.Rust:
    directory: lsp/rust
    version: stable
    no-autodownload: false
    autodelete: false

  # Tree-sitter parsers as addons
  org.devenv.Neovim.TreeSitter:
    directory: tree-sitter
    version: stable
    subdirectories: true
    no-autodownload: false
    autodelete: false
